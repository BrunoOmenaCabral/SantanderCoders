# Publica o site no GitHub Pages a cada envio à branch main.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Publica só os arquivos do site
      - name: Separar arquivos do site
        run: |
          mkdir _site
          cp -r index.html styles.css script.js assets _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: publicacao
        uses: actions/deploy-pages@v4
